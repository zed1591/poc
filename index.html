<!DOCTYPE html>
<html>
<head><title>CORS Redirect Check</title></head>
<body>
<h1>CORS Redirect Check</h1>
<pre id="output"></pre>
<script>
const target = 'https://cewrs-scrap-api.aii.et/profile/me';
const out = document.getElementById('output');

(async () => {
  // Test 1: follow redirects, see final URL
  try {
    const r = await fetch(target, { credentials: 'include', redirect: 'follow' });
    out.textContent += `[follow] status=${r.status}\n`;
    out.textContent += `[follow] final URL=${r.url}\n`;
    out.textContent += `[follow] redirected=${r.redirected}\n\n`;
    const body = await r.text();
    out.textContent += body.slice(0, 500) + '\n\n';
  } catch (e) {
    out.textContent += `[follow] ERROR: ${e.message}\n\n`;
  }

  // Test 2: block redirects, see raw response
  try {
    const r = await fetch(target, { credentials: 'include', redirect: 'manual' });
    out.textContent += `[manual] type=${r.type} status=${r.status}\n`;
    out.textContent += `[manual] URL=${r.url}\n`;
    // opaque response — body not readable, but status and URL tell you a lot
  } catch (e) {
    out.textContent += `[manual] ERROR: ${e.message}\n\n`;
  }
})();
</script>
</body>
</html>
